name: Container image

# Pushing a version tag (v0.2.0, v1.0.0, ...) builds the GUI server image
# from deploy/Dockerfile and publishes it to the GitHub Container Registry
# as ghcr.io/rapid-facility/rapidtools-gui. Two variants are pushed:
#   <version>, <major.minor>, latest          CUDA build (pytorch/pytorch base)
#   <version>-cpu, <major.minor>-cpu, latest-cpu  CPU-only build
# The repository is public, so the images are free to store and to pull
# without logging in. Building needs no GPU; an ordinary runner is enough.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rapidtools-gui

jobs:
  publish:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base_image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
            torch_index: ""
            suffix: ""
          - variant: cpu
            base_image: python:3.11-slim
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: -cpu

    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject version $VERSION" >&2
            exit 1
          fi

      # The CUDA image is several gigabytes; the runner's preinstalled
      # toolchains take the room it needs.
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns the tag v0.2.0 into the tags 0.2.0, 0.2 and latest (plus the
      # variant suffix) and lowercases the image name as the registry needs.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ github.ref_type == 'tag' }}
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=rAPIdtools GUI
            org.opencontainers.image.description=rAPIdtools GUI server (${{ matrix.variant }} build)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            TORCH_INDEX=${{ matrix.torch_index }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
