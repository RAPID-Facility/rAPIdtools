name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Deploy the Sphinx site to GitHub Pages. Enable Pages once in the repository
# settings (Settings > Pages > Source: "GitHub Actions"); after that every push
# to main republishes https://rapid-facility.github.io/rAPIdtools/.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install rapidtools with the docs extra
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch keeps the install small; autodoc only imports it.
          # torch and torchvision must come from the same index, otherwise the
          # default torchvision wheel is built against a different torch and
          # every model module fails with "operator torchvision::nms does not
          # exist".
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"

      - name: Build the site
        run: python -m sphinx -b html docs/source docs/build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
