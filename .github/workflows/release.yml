name: Release

# Pushing a version tag (v0.2.0, v1.0.0, ...) creates the matching GitHub
# Release. Zenodo watches GitHub Releases, so once the repository is enabled
# on zenodo.org this is what mints the DOI for each version.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject version $VERSION" >&2
            exit 1
          fi

      # CITATION.cff feeds GitHub's "Cite this repository" button and is
      # edited by hand for every release: its version must be the package
      # version and its date the one in the changelog heading.
      - name: Check that CITATION.cff matches the version and release date
        run: |
          python - <<'EOF'
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          cff = Path('CITATION.cff').read_text()
          changelog = Path('CHANGELOG.md').read_text()


          def cff_field(name):
              match = re.search(rf'^{name}:\s*["\']?([^"\'\s#]+)', cff, re.MULTILINE)
              return match.group(1) if match else None


          heading = re.search(
              rf'^## \[{re.escape(version)}\] - (\S+)', changelog, re.MULTILINE
          )
          problems = []
          if cff_field('version') != version:
              problems.append(
                  f"CITATION.cff version is {cff_field('version')}, "
                  f'pyproject.toml has {version}'
              )
          if heading is None:
              problems.append(f'CHANGELOG.md has no dated heading for {version}')
          elif cff_field('date-released') != heading.group(1):
              problems.append(
                  f"CITATION.cff date-released is {cff_field('date-released')}, "
                  f'CHANGELOG.md has {heading.group(1)}'
              )
          for problem in problems:
              print(problem, file=sys.stderr)
          sys.exit(1 if problems else 0)
          EOF

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { keep = 1; next }
            /^## \[/ && keep { exit }
            keep { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: rAPIdtools ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
