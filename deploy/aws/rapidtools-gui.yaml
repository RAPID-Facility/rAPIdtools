  # CREATE_COMPLETE only once the GUI answers; a source build can take 25 minutes.
  Ready:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref ReadyHandle
      Timeout: '3600'
      Count: 1

  # ---------------------------------------------------------- cost control
  WakeRole:
    Type: AWS::IAM::Role
    Condition: HasWake
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: wake
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WakeLogs.Arn
              - {Effect: Allow, Action: ec2:DescribeInstances, Resource: '*'}
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
  WakeLogs:
    Type: AWS::Logs::LogGroup
    Condition: HasWake
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties: {RetentionInDays: 14}
  WakeFunction:
    Type: AWS::Lambda::Function
    Condition: HasWake
    Properties:
      Description: Starts the stopped rapidtools GUI machine and forwards to the GUI
      Runtime: python3.13
      Handler: index.handler
      Timeout: 20
      MemorySize: 128
      Role: !GetAtt WakeRole.Arn
      LoggingConfig: {LogGroup: !Ref WakeLogs}
      Environment:
        Variables:
          INSTANCE_ID: !Ref Instance
          GUI_HOST: !If
            - HasDomain
            - !Ref DomainName
            - !Join ['', [rapidtools-, !Join ['-', !Split ['.', !GetAtt Address.PublicIp]], .sslip.io]]
      Code:
        ZipFile: |
          import os
          import urllib.error
          import urllib.request

          import boto3

          ec2 = boto3.client('ec2')
          IID = os.environ['INSTANCE_ID']
          HOST = os.environ['GUI_HOST']
          URL = f'https://{HOST}/'
          PAGE = (
              '<!doctype html><html><head><meta charset="utf-8">{meta}'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<meta name="robots" content="noindex"><title>rapidtools GUI</title>'
              '<style>body{{font-family:system-ui,sans-serif;max-width:34rem;margin:14vh auto;'
              'padding:0 1rem;line-height:1.5}}button{{font-size:1rem;padding:.6rem 1.2rem}}</style>'
              '</head><body><h2>rapidtools GUI</h2><p>{msg}</p></body></html>'
          )
          BUTTON = '<form method="post"><button type="submit">Start the server</button></form>'


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def page(msg, refresh=None, target=None, code=200):
              meta = ''
              if refresh is not None:
                  goto = f';url={target}' if target else ''
                  meta = f'<meta http-equiv="refresh" content="{refresh}{goto}">'
              return {
                  'statusCode': code,
                  'headers': {'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store'},
                  'body': PAGE.format(meta=meta, msg=msg),
              }


          def web_up():
              # Caddy answers on port 80 (a redirect to HTTPS) once the containers run.
              try:
                  urllib.request.build_opener(NoRedirect).open(f'http://{HOST}/', timeout=4)
                  return True
              except urllib.error.HTTPError:
                  return True
              except Exception:
                  return False


          def handler(event, context):
              http = event.get('requestContext', {}).get('http', {})
              method = http.get('method', 'GET')
              if event.get('rawPath', '/') != '/' or method not in ('GET', 'POST'):
                  return {'statusCode': 404, 'body': 'not found'}
              try:
                  inst = ec2.describe_instances(InstanceIds=[IID])['Reservations'][0]['Instances'][0]
                  state = inst['State']['Name']
                  if state == 'stopped':
                      if method != 'POST':  # a click, so link previews and crawlers start nothing
                          return page('The server is stopped to save cost.' + BUTTON)
                      ec2.start_instances(InstanceIds=[IID])
                      state = 'pending'
                  if state == 'running':
                      if web_up():
                          return page(
                              f'The server is up. Opening <a href="{URL}">{URL}</a>. If you get an '
                              'error there, wait half a minute and reload.', 2, URL)
                      return page('The server is booting. This page opens the GUI when it is ready.', 10, '?')
                  if state in ('pending', 'stopping'):
                      return page(
                          f'The server is {state}. This page opens the GUI when it is ready, '
                          'usually within three minutes.', 10, '?')
                  return page(f'The server is {state} and cannot be started from here.', code=503)
              except Exception as exc:
                  code = getattr(exc, 'response', {}).get('Error', {}).get('Code', type(exc).__name__)
                  print('wake failed:', code)
                  return page(
                      f'Could not start the server ({code}). Try again in a few minutes, or start '
                      'it in the EC2 console.', code=503)
  WakeUrl:
    Type: AWS::Lambda::Url
    Condition: HasWake
    Properties: {TargetFunctionArn: !GetAtt WakeFunction.Arn, AuthType: NONE}
  WakeUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasWake
    Properties:
      FunctionName: !GetAtt WakeFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  WakeInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasWake
    Properties:
      FunctionName: !GetAtt WakeFunction.Arn
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  StopScheduleRole:
    Type: AWS::IAM::Role
    Condition: HasDailyStop
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: scheduler.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: stop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasDailyStop
    Properties:
      Description: Daily stop of the rapidtools GUI machine
      FlexibleTimeWindow: {Mode: 'OFF'}
      ScheduleExpression: !Sub cron(0 ${DailyStopHour} * * ? *)
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      Target:
        Arn: !Sub arn:${AWS::Partition}:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt StopScheduleRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

Outputs:
  GuiUrl:
    Description: Address of the GUI. Add ?token=<access token> to make the share link.
    Value: !If
      - HasDomain
      - !Sub https://${DomainName}/
      - !Join ['', ['https://rapidtools-', !Join ['-', !Split ['.', !GetAtt Address.PublicIp]], .sslip.io/]]
  GetTokenCommand:
    Description: Prints the access token (AWS CLI or CloudShell). The token itself is never shown here.
    Value: !Sub >-
      aws ssm get-parameter --region ${AWS::Region} --name /rapidtools/${AWS::StackName}/gui-token
      --with-decryption --query Parameter.Value --output text
  TokenConsoleLink:
    Description: The access token in the console (press Show decrypted value).
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/systems-manager/parameters/rapidtools/${AWS::StackName}/gui-token/description?region=${AWS::Region}&tab=Table
  WakeLink:
    Condition: HasWake
    Description: Open this to start the machine after it stopped; it forwards to the GUI.
    Value: !GetAtt WakeUrl.FunctionUrl
  ElasticIp:
    Description: Fixed public address. With your own DNS name, point an A record here.
    Value: !GetAtt Address.PublicIp
  InstanceId:
    Description: The EC2 machine.
    Value: !Ref Instance
  ConnectCommand:
    Description: Opens a shell on the machine through Session Manager (no SSH key needed).
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${Instance}
  StartCommand:
    Description: Starts the machine after it stopped.
    Value: !Sub aws ec2 start-instances --region ${AWS::Region} --instance-ids ${Instance}
  StopCommand:
    Description: Stops the machine (disks and address are kept).
    Value: !Sub aws ec2 stop-instances --region ${AWS::Region} --instance-ids ${Instance}
  DataVolumeId:
    Description: Data disk mounted on /srv/rapidtools. Saved as a snapshot when the stack is deleted.
    Value: !Ref DataVolume
  BootstrapResult:
    Description: What the machine reported when it finished setting up.
    Value: !GetAtt Ready.Data
